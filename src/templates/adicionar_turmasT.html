<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>Adicionar Turma</title>
</head>

<body>

    {% include 'authInfo.html' %}

    <h1 align="center">Adicionar Turma</h1>

    <p id="mensagem"></p>

    <div id="conteudoTurmas" style="display: none;">

        <form id="adicionarTurmaForm">

            <label for="Nome">Nome da Turma:</label>
            <input type="text" id="Nome" maxlength="20" required>

            <br><br>

            <label for="ano_letivo">Ano Letivo:</label>
            <input type="text" id="ano_letivo" placeholder="2026/2027"
                   pattern="[0-9]{4}/[0-9]{4}" maxlength="9" required>

            <br><br>

            <label for="curso_id">ID do Curso (opcional):</label>
            <input type="number" id="curso_id" min="1">

            <br><br>

            <label for="limite_alunos">Limite de Alunos:</label>
            <input type="number" id="limite_alunos" min="1" max="100"
                   value="30" required>

            <br><br>

            <label for="ativa">Turma Ativa:</label>
            <input type="checkbox" id="ativa" checked>

            <br><br>

            <button type="submit">Adicionar Turma</button>

        </form>

    </div>

    <br>

    <a href="/admin">Voltar ao Menu Admin</a>

    <br><br>

    <a href="/">Voltar à página inicial</a>

    <script src="{{ url_for('static', filename='js/adicionar_turmas.js') }}"></script>

</body>
</html>
