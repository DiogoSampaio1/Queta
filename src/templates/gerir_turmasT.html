<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>Gerir Turmas</title>
</head>
<body>
    {% include 'authInfo.html' %}

    <h1 align="center">Gerir Turmas</h1>

    <p id="mensagem"></p>

    <div id="conteudoTurmas" style="display: none;">
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Ano Letivo</th>
                    <th>Limite de Alunos</th>
                    <th>Estado</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="listaTurmas"></tbody>
        </table>

        <br>

        <form id="gerirTurmaForm" style="display: none;">
            <h2>Editar Turma</h2>

            <label for="codigo">Código da Turma:</label>
            <input type="text" id="codigo" maxlength="20" required>
            <br><br>

            <label for="ano_letivo">Ano Letivo:</label>
            <input type="text" id="ano_letivo" placeholder="2026/2027"
                   pattern="[0-9]{4}/[0-9]{4}" maxlength="9" required>
            <br><br>

            <label for="limite_alunos">Limite de Alunos:</label>
            <input type="number" id="limite_alunos" min="1" max="100" required>
            <br><br>

            <label for="ativa">Turma Ativa:</label>
            <input type="checkbox" id="ativa">
            <br><br>

            <button type="submit">Guardar Alterações</button>
            <button type="button" id="cancelarEdicao">Cancelar</button>
        </form>
    </div>

    <br>
    <a href="/admin">Voltar ao Menu Admin</a>
    <br><br>
    <a href="/">Voltar à página inicial</a>

    <script src="{{ url_for('static', filename='js/gerir_turmas.js') }}"></script>
</body>
</html>
