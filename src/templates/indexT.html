<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>Gestão de Alunos</title>
</head>

<body>
    {% include 'authInfo.html' %}

    <h1 align="center">Gestão de Alunos</h1>

    <h2>Bem-vindo!</h2>

    <p>Escolha uma das opções disponíveis:</p>

    <p><a href="/alunos">Lista de Alunos</a></p>

    <p id="adminMenu" style="display: none;">
        <a href="/admin">Menu de Administração</a>
    </p>

     <p id="profMenu" style="display: none;">
        <a href="/prof">Menu de Professores</a>
    </p>

    <script>
        if (sessionStorage.getItem("role") === "admin") {
            document.getElementById("adminMenu").style.display = "block";
        }
        if (sessionStorage.getItem("role") === "professor") {
            document.getElementById("profMenu").style.display = "block";
        }
    </script>

</body>
</html>
