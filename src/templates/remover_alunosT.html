<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>Remover Aluno</title>
</head>

<body>

    {% include 'authInfo.html' %}

    <h1 align="center">Gerir Utilizador</h1>

    <p id="mensagem"></p>

    <div id="conteudoRemover" style="display: none;">

        <p>Seleciona o utilizador e indica o novo estado da sua conta.</p>

    <form id="removerAlunoForm">

        <label for="numero_aluno">Número de Utilizador:</label>
        <input type="text" id="numero_aluno" required>

        <br><br>

        <div id="infoAluno" style="display: none;">

            <h3>Informações do Utilizador</h3>

            <p>
                <strong>Nome:</strong>
                <span id="nomeAluno"></span>
            </p>

            <p>
                <strong>Estado atual:</strong>
                <span id="estadoAtual"></span>
            </p>

            <p>
                <strong>Role atual:</strong>
                <span id="roleAtual"></span>
            </p>

            <br>

            <label for="estado">Novo Estado:</label>
            <select id="estado" required>
                <option value="">Selecionar estado</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
                <option value="Transferido">Transferido</option>
                <option value="Concluido">Concluído</option>
            </select>

            <br><br>

            <label for="novaRole">Novo Papel:</label>
            <select id="novaRole" disabled>
                <option value="">Manter role atual</option>
                <option value="aluno">Aluno</option>
                <option value="professor">Professor</option>
                <option value="admin">Administrador</option>
            </select>

            <br><br>

            <label for="observacoes">Observações:</label>
            <br>

            <textarea id="observacoes" rows="4" cols="40" maxlength="500"></textarea>

            <br><br>

            <button type="submit">Alterar Dados do Utilizador</button>

        </div>

    </form>

    </div>

    <br>

    <a href="/admin">Voltar ao Menu Admin</a>

    <br><br>

    <a href="/">Voltar à página inicial</a>

    <script src="{{ url_for('static', filename='js/remover_alunos.js') }}"></script>

</body>
</html>
